<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jetis · Pemeriksaan responsif</title><style>*{box-sizing:border-box}body{margin:0;background:#1e2929;color:#eef5f1;font:14px system-ui}header{padding:18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}label{display:flex;gap:7px;align-items:center}select{font:inherit;padding:8px;border-radius:8px}main{margin:0 18px 18px;display:flex;justify-content:center;align-items:flex-start;overflow:auto;height:calc(100vh - 88px)}.frame-box{position:relative;flex:none}iframe{border:0;display:block;transform-origin:0 0;background:#e9e9e7}a{color:inherit}output{opacity:.75;font-size:12px}</style><header><strong>Pemeriksaan responsif Jetis</strong><label for="size">Ukuran <select id="size"><option value="390,844">Mobile · 390 × 844</option><option value="1440,900">Desktop · 1440 × 900</option><option value="3840,2160">4K · 3840 × 2160</option></select></label><label for="view">Tampilan <select id="view"><option value="source">DWG asli</option><option value="drawings">Gambar teknik</option><option value="model">Model 3D</option></select></label><output id="note">Simulasi viewport, bukan pengukuran perangkat fisik</output><a href="../">Buka proyek</a></header><main><div class="frame-box"><iframe id="preview" title="Viewport pemeriksaan Jetis" allow="fullscreen" src="../?view=source"></iframe></div></main><script>const frame=document.getElementById('preview'),box=document.querySelector('.frame-box');function size(){const [w,h]=document.getElementById('size').value.split(',').map(Number),scale=Math.min(1,(innerWidth-44)/w,(innerHeight-105)/h);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';box.style.width=w*scale+'px';box.style.height=h*scale+'px';}document.getElementById('size').onchange=size;document.getElementById('view').onchange=e=>frame.src='../?view='+e.target.value;window.onresize=size;size();</script></html>
